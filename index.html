<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BE Fit Club</title>
  <meta name="description" content="Monday night football: live scores, points and the season table.">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0B0D10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BE Fit Club">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">

  <!-- Type: Geist for words, Geist Mono for every number -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">

  <!-- Styles: tokens → base → shared components → one file per screen area -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/welcome.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/setup.css">
  <link rel="stylesheet" href="css/console.css">
  <link rel="stylesheet" href="css/fix.css">
  <link rel="stylesheet" href="css/admin.css">

  <!-- Settings + theme before first paint (the only blocking script) -->
  <script src="js/core/config.js"></script>

  <!-- Core (order matters) -->
  <script defer src="js/core/store.js"></script>
  <script defer src="js/core/scoring.js"></script>
  <script defer src="js/core/clock.js"></script>
  <script defer src="js/core/auth.js"></script>
  <script defer src="js/core/save.js"></script>
  <!-- UI -->
  <script defer src="js/ui/components.js"></script>
  <script defer src="js/ui/shell.js"></script>
  <!-- Screens (each file registers its screens; the shell starts on DOMContentLoaded) -->
  <script defer src="js/screens/welcome.js"></script>
  <script defer src="js/screens/player.js"></script>
  <script defer src="js/screens/setup.js"></script>
  <script defer src="js/screens/console.js"></script>
  <script defer src="js/screens/fix.js"></script>
  <script defer src="js/screens/admin.js"></script>
</head>
<body>
  <div class="app" id="app">
    <nav class="rail" id="app-rail" aria-label="Sections"></nav>
    <div class="app-main">
      <header class="hd" id="app-header"></header>
      <div id="app-status" aria-live="polite"></div>
      <main class="screen-host" id="app-screen"></main>
    </div>
    <nav class="nav" id="app-nav" aria-label="Tabs"></nav>
  </div>
  <div id="app-layer"></div>
  <div id="app-undo"></div>
  <div id="app-toast"></div>
  <noscript><p style="padding:24px">BE Fit Club needs JavaScript. The classic app is at <a href="classic.html">classic.html</a>.</p></noscript>
</body>
</html>
