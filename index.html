  <!-- Splash (front door): always dark, drawn from inline SVG so it paints on the first frame and works offline. Rules: the script right after #splash in <body>. -->
  <style id="splash-css">
    .spl { position: fixed; inset: 0; z-index: 100; background: #0B0D10; display: grid; place-items: center; overflow: hidden; transition: opacity .28s ease; }
    .spl::before, .spl::after { content: ''; position: absolute; inset: 0; opacity: 0; pointer-events: none; }
    .spl::before { background: radial-gradient(95% 45% at 50% -4%, rgba(255,255,255,.13), transparent 70%); }
    .spl::after { background: radial-gradient(75% 38% at -5% 102%, rgba(61,214,140,.22), transparent 70%), radial-gradient(75% 38% at 105% 102%, rgba(242,85,90,.20), transparent 70%); }
    .spl.run::before { animation: spl-lit .4s forwards; }
    .spl.run::after { animation: spl-lit .6s 1.9s forwards; }
    .spl.static::before, .spl.static::after { opacity: 1; }
    .spl svg { position: relative; z-index: 1; display: block; width: 100%; max-width: 420px; height: auto; }
    .spl.out { opacity: 0; pointer-events: none; }
    @keyframes spl-lit { to { opacity: 1; } }
  </style>
